server.port=${PORT:8080}
server.address=0.0.0.0

# Local usa H2; Railway/producao deve definir SPRING_DATASOURCE_* para Postgres.
recce.environment=${RECCE_ENV:dev}
recce.test-user.enabled=${RECCE_TEST_USER_ENABLED:true}
recce.test-user.email=${RECCE_TEST_USER_EMAIL:test@reccestudio.local}
recce.test-user.password=${RECCE_TEST_USER_PASSWORD:123456}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

recce.upload-dir=${RECCE_UPLOAD_DIR:uploads}
recce.storage.type=${RECCE_STORAGE_TYPE:local}
recce.storage.s3.bucket=${RECCE_STORAGE_BUCKET:}
recce.storage.s3.endpoint=${RECCE_STORAGE_ENDPOINT:}
recce.storage.s3.region=${RECCE_STORAGE_REGION:us-east-1}
recce.storage.s3.access-key=${RECCE_STORAGE_ACCESS_KEY:}
recce.storage.s3.secret-key=${RECCE_STORAGE_SECRET_KEY:}
recce.storage.s3.url-style=${RECCE_STORAGE_URL_STYLE:virtual}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:500MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:500MB}
