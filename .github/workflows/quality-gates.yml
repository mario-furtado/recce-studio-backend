name: Quality Gates

on:
  pull_request:
  workflow_dispatch:
    inputs:
      level:
        description: Quality gate level
        required: true
        default: STANDARD
        type: choice
        options:
          - FAST
          - STANDARD
          - DEEP

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality gate (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      REQUESTED_LEVEL: ${{ inputs.level }}
      DEEP_PULL_REQUEST: ${{ contains(github.event.pull_request.labels.*.name, 'quality-deep') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Run quality gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ "$DEEP_PULL_REQUEST" == "true" ]]; then
              node tools/run-quality-gate.mjs release DEEP
            else
              node tools/run-quality-gate.mjs release STANDARD
            fi
          else
            case "$REQUESTED_LEVEL" in
              FAST) node tools/run-quality-gate.mjs release FAST ;;
              STANDARD) node tools/run-quality-gate.mjs release STANDARD ;;
              DEEP) node tools/run-quality-gate.mjs release DEEP ;;
              *) echo "Unsupported quality gate: $REQUESTED_LEVEL" >&2; exit 2 ;;
            esac
          fi
