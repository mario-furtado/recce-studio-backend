<div class="max-w-6xl mx-auto space-y-6">
  <section class="glass-panel rs-page-header">
    <div
      class="flex flex-col md:flex-row md:items-start md:justify-between gap-4"
    >
      <div>
        <div class="rs-eyebrow">Notas</div>
        <h1 class="rs-page-title">Dicionario de notas</h1>
        <p class="rs-page-subtitle">
          Define como a voz do navegador vira nota compacta durante o reconhecimento.
        </p>
      </div>

      <button
        type="button"
        (click)="loadRules()"
        [disabled]="isLoading || shared.connectionMode$.value !== 'online'"
        class="soft-button px-4 py-2 rounded-lg text-sm font-bold disabled:opacity-50"
        title="Atualizar regras guardadas no backend"
      >
        {{ isLoading ? "A carregar..." : "Atualizar" }}
      </button>
    </div>
  </section>

  <section class="glass-panel rounded-2xl p-6 space-y-5">
    <form
      class="grid grid-cols-1 md:grid-cols-[1.35fr_0.9fr_0.9fr_auto] gap-3 items-end"
      (ngSubmit)="saveRule()"
    >
      <label class="block">
        <span class="text-xs font-bold uppercase text-slate-400">
          Quando digo
        </span>
        <input
          type="text"
          name="phrase"
          [(ngModel)]="form.phrase"
          class="themed-input mt-1 w-full px-4 py-3"
          placeholder="direita tres"
          title="Palavra ou frase dita no reconhecimento"
        />
      </label>

      <label class="block">
        <span class="text-xs font-bold uppercase text-slate-400">
          Escrever
        </span>
        <input
          type="text"
          name="symbol"
          [(ngModel)]="form.symbol"
          class="themed-input mt-1 w-full px-4 py-3"
          placeholder="D3"
          title="Texto compacto que deve aparecer na nota"
        />
      </label>

      <label class="block">
        <span class="text-xs font-bold uppercase text-slate-400">
          Grupo
        </span>
        <input
          type="text"
          name="category"
          [(ngModel)]="form.category"
          class="themed-input mt-1 w-full px-4 py-3"
          placeholder="curvas"
          title="Grupo opcional para organizar as regras"
        />
      </label>

      <div class="flex flex-wrap items-center gap-2">
        <label
          class="soft-button inline-flex items-center gap-2 px-3 py-3 text-sm"
          title="Ativar ou desativar esta regra"
        >
          <input type="checkbox" name="enabled" [(ngModel)]="form.enabled" />
          Ativa
        </label>
        <button
          type="submit"
          [disabled]="isSaving"
          class="accent-button px-4 py-3 rounded-xl text-sm font-black disabled:opacity-50"
          [attr.title]="editingRuleId ? 'Guardar alteracoes' : 'Adicionar regra'"
        >
          {{ editingRuleId ? "Guardar" : "Adicionar" }}
        </button>
        <button
          *ngIf="editingRuleId"
          type="button"
          (click)="cancelEdit()"
          class="soft-button px-4 py-3 rounded-xl text-sm font-bold"
          title="Cancelar edicao"
        >
          Cancelar
        </button>
      </div>
    </form>
  </section>

  <section class="glass-panel rounded-2xl p-6 space-y-3">
    <div class="flex items-center justify-between gap-3">
      <h2 class="rs-section-title">Regras existentes</h2>
      <span class="themed-chip text-[11px] px-2 py-1">
        {{ rules.length }} regras
      </span>
    </div>

    <div
      *ngIf="rules.length === 0"
      class="rounded-xl border border-dashed border-slate-800 p-5 text-sm text-slate-400"
    >
      Ainda nao existem regras personalizadas.
    </div>

    <div
      *ngFor="let rule of rules; trackBy: trackRule"
      class="note-rule-row rounded-xl border border-slate-800 bg-slate-950/40 p-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4"
      [class.opacity-55]="!rule.enabled"
    >
      <div class="min-w-0">
        <div class="flex flex-wrap items-center gap-2">
          <span class="text-sm font-bold text-white">{{ rule.phrase }}</span>
          <span class="text-xs text-slate-500">-></span>
          <span class="themed-chip text-xs px-2 py-0.5">
            {{ rule.symbol }}
          </span>
          <span
            *ngIf="rule.category"
            class="text-[11px] text-slate-400 rounded-full border border-slate-800 px-2 py-0.5"
          >
            {{ rule.category }}
          </span>
          <span
            *ngIf="rule.localOnly"
            class="text-[11px] text-amber-200 rounded-full border border-amber-500/30 px-2 py-0.5"
          >
            Local
          </span>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <button
          type="button"
          (click)="toggleRule(rule)"
          class="soft-button px-3 py-2 rounded-lg text-xs font-bold"
          [attr.title]="rule.enabled ? 'Desativar regra' : 'Ativar regra'"
        >
          {{ rule.enabled ? "Desativar" : "Ativar" }}
        </button>
        <button
          type="button"
          (click)="editRule(rule)"
          class="soft-button px-3 py-2 rounded-lg text-xs font-bold"
          title="Editar regra"
        >
          Editar
        </button>
        <button
          type="button"
          (click)="deleteRule(rule)"
          class="danger-button px-3 py-2 rounded-lg text-xs font-bold"
          title="Eliminar regra"
        >
          Eliminar
        </button>
      </div>
    </div>
  </section>
</div>
