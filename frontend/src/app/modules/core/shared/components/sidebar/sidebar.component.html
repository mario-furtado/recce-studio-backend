<aside
  [class.w-64]="!isCollapsed"
  [class.w-20]="isCollapsed"
  class="app-sidebar flex flex-col justify-between h-screen z-20 sticky top-0"
>
  <div class="min-w-0">
    <div
      class="sidebar-header flex items-start justify-between gap-3"
      [class.sidebar-header-collapsed]="isCollapsed"
    >
      <div class="rs-brand-lockup" [class.justify-center]="isCollapsed">
        <div class="rs-mark rs-mark-asset" aria-hidden="true">
          <img src="assets/brand/recce-studio-icon-dark.png" alt="" />
        </div>
        <div *ngIf="!isCollapsed" class="rs-wordmark">
          <strong>RECCE <span>STUDIO</span></strong>
          <small>Read the Road.</small>
        </div>
      </div>

      <button
        type="button"
        class="sidebar-toggle-button"
        [class.sidebar-toggle-button-collapsed]="isCollapsed"
        (click)="toggleSidebar()"
        [attr.aria-label]="isCollapsed ? 'Expandir menu' : 'Recolher menu'"
        [title]="isCollapsed ? 'Expandir menu' : 'Recolher menu'"
      >
        <svg *ngIf="!isCollapsed" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 6l-6 6 6 6" />
        </svg>
        <svg *ngIf="isCollapsed" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 6l6 6-6 6" />
        </svg>
      </button>
    </div>

    <nav class="sidebar-nav px-3 space-y-1.5" aria-label="Navegacao principal">
      <a
        routerLink="/pecs"
        routerLinkActive="selected-ring text-white font-semibold"
        [routerLinkActiveOptions]="{ exact: false }"
        [class.offline-disabled]="
          (shared.connectionMode$ | async) === 'offline'
        "
        class="sidebar-link interactive-card flex items-center gap-3 px-3 py-3"
        [title]="isCollapsed ? 'Ralis & PECs' : null"
      >
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M5 4h10l4 4v12H5z" />
            <path d="M15 4v5h5" />
            <path d="M8 13h8M8 17h5" />
          </svg>
        </span>
        <span *ngIf="!isCollapsed" class="whitespace-nowrap">Ralis & PECs</span>
      </a>

      <!-- <a
        [routerLink]="(shared.connectionMode$ | async) === 'offline' ? '/recce-mode' : '/new-recce'"
        routerLinkActive="selected-ring text-white font-semibold"
        class="sidebar-link interactive-card flex items-center gap-3 px-3 py-3"
        [title]="isCollapsed ? ((shared.connectionMode$ | async) === 'offline' ? 'Reconhecimento' : 'Criar Nova PEC') : null"
      >
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </span>
        <span *ngIf="!isCollapsed" class="whitespace-nowrap">
          {{ (shared.connectionMode$ | async) === "offline" ? "Reconhecimento" : "Criar Nova PEC" }}
        </span>
      </a> -->

      <a
        routerLink="/offline-recces"
        routerLinkActive="selected-ring text-white font-semibold"
        class="sidebar-link interactive-card flex items-center gap-3 px-3 py-3"
        [title]="isCollapsed ? 'Reconhecimentos Offline' : null"
      >
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M4 6l5-2 6 2 5-2v14l-5 2-6-2-5 2z" />
            <path d="M9 4v14M15 6v14" />
          </svg>
        </span>
        <span *ngIf="!isCollapsed" class="whitespace-nowrap"
          >Reconhecimentos Offline</span
        >
      </a>

      <a
        routerLink="/team-profile"
        routerLinkActive="selected-ring text-white font-semibold"
        [class.offline-disabled]="
          (shared.connectionMode$ | async) === 'offline'
        "
        class="sidebar-link interactive-card flex items-center gap-3 px-3 py-3"
        [title]="isCollapsed ? 'Perfil da Equipa' : null"
      >
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M16 11a4 4 0 1 0-8 0" />
            <path d="M4 20c1.5-4 14.5-4 16 0" />
            <path d="M18 8a3 3 0 0 1 3 3M3 11a3 3 0 0 1 3-3" />
          </svg>
        </span>
        <span *ngIf="!isCollapsed" class="whitespace-nowrap"
          >Perfil da Equipa</span
        >
      </a>

      <a
        routerLink="/settings"
        routerLinkActive="selected-ring text-white font-semibold"
        [class.offline-disabled]="
          (shared.connectionMode$ | async) === 'offline'
        "
        class="sidebar-link interactive-card flex items-center gap-3 px-3 py-3"
        [title]="isCollapsed ? 'Configuracoes' : null"
      >
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" />
            <path
              d="M4 12h2M18 12h2M12 4v2M12 18v2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M17.7 6.3l-1.4 1.4M7.7 16.3l-1.4 1.4"
            />
          </svg>
        </span>
        <span *ngIf="!isCollapsed" class="whitespace-nowrap"
          >Configuracoes</span
        >
      </a>

      <a
        routerLink="/tutorial"
        routerLinkActive="selected-ring text-white font-semibold"
        class="sidebar-link interactive-card flex items-center gap-3 px-3 py-3"
        [title]="isCollapsed ? 'Tutorial' : null"
      >
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M5 5h14v14H5z" />
            <path d="M9 9h6M9 13h6M9 17h3" />
          </svg>
        </span>
        <span *ngIf="!isCollapsed" class="whitespace-nowrap">Tutorial</span>
      </a>
    </nav>

    <div class="mobile-session-bar">
      <button
        type="button"
        (click)="toggleConnectionMode()"
        class="mobile-session-button"
        [disabled]="isSwitchingConnectionMode"
        [class.is-offline]="(shared.connectionMode$ | async) === 'offline'"
      >
        <span
          class="rs-status-dot"
          [class.is-offline]="(shared.connectionMode$ | async) === 'offline'"
          aria-hidden="true"
        ></span>
        <span>
          {{
            isSwitchingConnectionMode
              ? "A validar"
              : (shared.connectionMode$ | async) === "offline"
                ? "Offline"
                : "Online"
          }}
        </span>
      </button>

      <button
        type="button"
        (click)="logout()"
        class="mobile-session-button mobile-logout-button"
      >
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M10 6H5v12h5" />
            <path d="M14 8l4 4-4 4M18 12H9" />
          </svg>
        </span>
        <span>Logout</span>
      </button>
    </div>
  </div>

  <div class="sidebar-footer p-4 text-xs space-y-3">
    <button
      type="button"
      (click)="toggleConnectionMode()"
      class="connection-toggle soft-button w-full px-3 py-2 text-xs"
      [disabled]="isSwitchingConnectionMode"
      [class.selected-ring]="(shared.connectionMode$ | async) === 'offline'"
      [title]="
        isCollapsed
          ? (shared.connectionMode$ | async) === 'offline'
            ? 'Modo Offline'
            : 'Modo Online'
          : null
      "
    >
      <span
        class="rs-status-dot"
        [class.is-offline]="(shared.connectionMode$ | async) === 'offline'"
        aria-hidden="true"
      ></span>
      <span *ngIf="!isCollapsed">
        {{
          isSwitchingConnectionMode
            ? "A validar ligacao"
            : (shared.connectionMode$ | async) === "offline"
              ? "Modo offline"
              : "Modo online"
        }}
      </span>
    </button>

    <button
      type="button"
      (click)="logout()"
      class="soft-button w-full px-3 py-2 text-xs hover:text-red-100"
      [title]="isCollapsed ? 'Logout' : null"
    >
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M10 6H5v12h5" />
          <path d="M14 8l4 4-4 4M18 12H9" />
        </svg>
      </span>
      <span *ngIf="!isCollapsed">Logout</span>
    </button>

    <div class="flex items-center gap-2 text-[11px] text-slate-500">
      <span class="w-1.5 h-1.5 rounded-full bg-sky-500"></span>
      <span *ngIf="!isCollapsed">Studio v1.0 · Offline Ready</span>
    </div>
  </div>
</aside>

<button
  type="button"
  class="quick-panel-handle soft-button"
  [class.quick-panel-handle-open]="isQuickPanelOpen"
  (click)="toggleQuickPanel()"
  aria-label="Abrir acoes rapidas"
>
  {{ isQuickPanelOpen ? ">" : "<" }}
</button>

<section
  class="quick-panel glass-panel"
  [class.quick-panel-open]="isQuickPanelOpen"
>
  <div class="text-xs font-black text-white">Acoes rapidas</div>
  <button
    type="button"
    (click)="toggleConnectionMode()"
    class="soft-button w-full px-3 py-2 text-xs font-bold mt-3"
    [disabled]="isSwitchingConnectionMode"
    [class.selected-ring]="(shared.connectionMode$ | async) === 'offline'"
  >
    {{
      isSwitchingConnectionMode
        ? "A validar..."
        : (shared.connectionMode$ | async) === "offline"
          ? "Modo Offline"
          : "Modo Online"
    }}
  </button>
  <p class="text-[11px] text-slate-400 mt-2 leading-snug">
    Offline permite novo reconhecimento local para sincronizacao posterior.
  </p>
  <a
    routerLink="/recce-mode"
    (click)="isQuickPanelOpen = false"
    class="accent-button block text-center w-full px-3 py-2 text-xs font-bold mt-3"
  >
    Novo reconhecimento
  </a>
  <a
    routerLink="/offline-recces"
    (click)="isQuickPanelOpen = false"
    class="soft-button block text-center w-full px-3 py-2 text-xs font-bold mt-3"
  >
    Recces offline
  </a>
  <button
    type="button"
    (click)="logout()"
    class="soft-button w-full px-3 py-2 text-xs font-bold mt-3"
  >
    Logout
  </button>
</section>
